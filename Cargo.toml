[package]
name = "stellar-verify"
version = "0.1.0"
edition = "2021"
description = "A developer-focused toolkit for examining and verifying Stellar transaction-related evidence."

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.1"
stellar-xdr = "30.0.0"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.27.0"
